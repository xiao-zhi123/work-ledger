name: 一键打包发布

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包应用文件
        run: cp index.html 工作记账.html

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create v-latest \
            "工作记账.html" \
            --title "工作记账 最新版" \
            --notes "自动生成于每次代码更新。下载 **工作记账.html** 发送到手机即可离线使用。" \
            --target main
